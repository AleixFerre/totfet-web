<a href="./help" class="help-icon" pTooltip="Ajuda" aria-label="Ajuda">
  <i class="pi pi-question-circle"></i>
</a>

<form [formGroup]="formGroup" class="centered">
  <h1 class="title">Tot Fet</h1>

  @let list = formGroup.controls.list;
  <div class="input">
    <p-floatlabel>
      <input
        pInputText
        id="list"
        formControlName="list"
        type="text"
        required
        fluid
        [invalid]="list.touched && list.invalid"
      />
      <label for="list">Nom de la llista</label>
    </p-floatlabel>
    <!-- Gated on `touched` because Material's form field only revealed
         mat-error once the control had been touched or the form submitted. -->
    @if (list.touched && list.hasError('required')) {
      <p-message severity="error" variant="simple" size="small">
        El nom de la llista és obligatori
      </p-message>
    }
  </div>

  @let password = formGroup.controls.password;
  <div class="input">
    <p-floatlabel>
      <input
        pInputText
        id="password"
        formControlName="password"
        type="password"
        required
        fluid
        [invalid]="password.touched && password.invalid"
      />
      <label for="password">Contrasenya</label>
    </p-floatlabel>
    @if (password.touched && password.hasError('required')) {
      <p-message severity="error" variant="simple" size="small">
        La contrasenya és obligatoria
      </p-message>
    }
  </div>

  <p-button
    class="submit"
    label="Iniciar Sessió"
    fluid
    [disabled]="formGroup.invalid"
    (onClick)="sendRequest()"
  />
</form>
