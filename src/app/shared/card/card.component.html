<div class="card">
  <span class="amount">{{ item.amount }}</span>
  <span class="name">{{ item.name }}</span>
  @for (action of actions; track action) {
    <p-button
      [text]="true"
      [rounded]="true"
      [icon]="CardActionIcons[action]"
      [severity]="CardActionSeverities[action]"
      (onClick)="onClick.next(action)"
    />
  }
</div>
