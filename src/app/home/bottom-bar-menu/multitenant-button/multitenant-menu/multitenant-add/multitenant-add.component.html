<p>
  <b>Surt de la sessió actual i entra a la nova.</b> Aquest cop et sortirà
  automàticament a la llista i podràs canviar entre llistes de forma ràpida.
</p>

<div class="actions">
  <p-button
    label="Cancel·lar"
    [text]="true"
    severity="danger"
    (onClick)="cancel()"
  />
  <p-button
    label="Sortir de la sessió"
    [text]="true"
    [pAutoFocus]="true"
    (onClick)="closeSession()"
  />
</div>
