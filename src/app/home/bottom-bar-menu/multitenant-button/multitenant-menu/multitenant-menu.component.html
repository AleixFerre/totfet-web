<h3>Llistes</h3>

<!-- Optimus has no radio-group wrapper: the radios are grouped by sharing a
     `name` and a model, and the checked state is keyed off the list name
     because `selectedList` is a different object instance than the entries in
     `lists` (identity comparison would never match). -->
<div class="radio-group">
  @for (list of lists; track $index) {
    <div class="radio-row">
      <p-radiobutton
        name="list"
        [inputId]="'list-' + $index"
        [value]="list.name"
        [ngModel]="selectedList.name"
        (ngModelChange)="selectList(list)"
      />
      <label [for]="'list-' + $index">{{ list.name | titlecase }}</label>
    </div>
  }
</div>

<p-button
  class="info-button"
  [text]="true"
  [rounded]="true"
  icon="pi pi-plus"
  ariaLabel="Info about multitenant menu"
  (onClick)="openInfo()"
/>
